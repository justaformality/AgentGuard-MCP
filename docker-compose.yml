services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - agentguard_data:/app/data
    environment:
      DATABASE_URL: sqlite:////app/data/agentguard.db

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  agentguard_data: